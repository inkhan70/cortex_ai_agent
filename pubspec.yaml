name: cortex_ai_agent
description: "Cortex AI Agent — autonomous Flutter dev agent with local terminal execution, offline model hub, web-search-assisted repair, and analytics."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Local persistence
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Analytics / charts
  fl_chart: ^0.68.0

  # Code display / syntax highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # Icons
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
